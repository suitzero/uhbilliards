<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body, html {
            margin: 0;
            padding: 0;

            /* Optical table grid pattern */

        /* UI Overlay */

<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="header">
            <div>
                <div id="stage-title">Stage 1: 거울 반사 (Reflection)</div>

        </div>

        <div class="footer">
            <div id="optics-panel">
                <h3>광학 원리 (Optics Principle)</h3>
                <div id="optics-formula">θi = θr</div>
                <div id="optics-desc">반사의 법칙: 매질의 경계면에서 반사될 때, 입사각과 반사각은 법선을 기준으로 항상 같습니다.</div>
            </div>
        </div>
    </div>

    <div id="message-banner">
        <div id="message-text">Signal Detected! (클리어)</div>
        <button id="next-stage-btn" class="btn">다음 스테이지</button>
    </div>

<script>
/**
 * -------------------------------------------------------------
 * 2D Vector Math Library
 * -------------------------------------------------------------
 * Provides basic vector operations essential for optics calculations
 * like reflection (dot product) and refraction.
 */
class Vec2 {
    constructor(x, y) {
        this.x = x;
        this.y = y;
    }
    add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vec2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        let m = this.mag();
        return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m);
    }
    dot(v) { return this.x * v.x + this.y * v.y; }
    cross(v) { return this.x * v.y - this.y * v.x; } // 2D cross product equivalent (returns scalar)
    dist(v) { return this.sub(v).mag(); }
    copy() { return new Vec2(this.x, this.y); }
    // Rotate vector by angle (in radians)
    rotate(angle) {
        let cosA = Math.cos(angle);
        let sinA = Math.sin(angle);
        return new Vec2(
            this.x * cosA - this.y * sinA,
            this.x * sinA + this.y * cosA
        );
    }
}

/**
 * -------------------------------------------------------------
 * Optics Entities & Physics Engine
 * -------------------------------------------------------------
 */

// Represents a single segment of a laser beam
class BeamSegment {
    constructor(start, end, intensity = 1.0, color = '#0f0') {
        this.start = start; // Vec2
        this.end = end;     // Vec2
        this.intensity = intensity; // 0.0 to 1.0
        this.color = color;
    }

    draw(ctx) {
        if (this.intensity < 0.05) return;
        ctx.beginPath();
        ctx.moveTo(this.start.x, this.start.y);
        ctx.lineTo(this.end.x, this.end.y);

        // Intensity affects opacity and thickness
        let alpha = Math.max(0.2, this.intensity);
        ctx.strokeStyle = `rgba(0, 255, 0, ${alpha})`;
        ctx.lineWidth = 2 + (this.intensity * 2);

        // Add glow effect
        ctx.shadowBlur = 10 * this.intensity;
        ctx.shadowColor = '#0f0';

        ctx.stroke();
        ctx.shadowBlur = 0; // Reset
    }
}

// Light Source (Laser)
class LaserSource {
    constructor(x, y, dirAngle) {
        this.pos = new Vec2(x, y);
        this.dir = new Vec2(Math.cos(dirAngle), Math.sin(dirAngle));
        this.angle = dirAngle;
        this.radius = 15;
        this.isOn = true;
    }

    // Interactive rotation
    setDirection(targetPos) {
        let diff = targetPos.sub(this.pos);
        this.dir = diff.normalize();
        this.angle = Math.atan2(this.dir.y, this.dir.x);
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#333';
        ctx.fill();
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw emission direction indicator
        ctx.beginPath();
        ctx.moveTo(this.pos.x, this.pos.y);
        let nozzleEnd = this.pos.add(this.dir.mult(this.radius + 10));
        ctx.lineTo(nozzleEnd.x, nozzleEnd.y);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 4;
        ctx.stroke();
    }
}

// Detector (Target)
class Detector {
    constructor(x, y) {
        this.pos = new Vec2(x, y);
        this.radius = 20;
        this.detectedIntensity = 0;
        this.requiredIntensity = 0.5; // Threshold to activate
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);

        // Color based on activation
        if (this.detectedIntensity >= this.requiredIntensity) {
            ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.strokeStyle = '#0f0';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#0f0';
        } else {
            ctx.fillStyle = '#222';
            ctx.strokeStyle = '#555';
            ctx.shadowBlur = 0;
        }

        ctx.lineWidth = 3;
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Draw inner sensor
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.radius * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = this.detectedIntensity >= this.requiredIntensity ? '#0f0' : '#444';
        ctx.fill();
    }
}

// Base class for optical components
class OpticalComponent {
    constructor(x, y, width, angle) {
        this.pos = new Vec2(x, y);
        this.width = width; // Length of the component
        this.angle = angle; // Angle in radians
        this.isDraggable = true;
        this.isRotatable = true;
        // Calculate endpoints based on center pos and angle
        this.updateEndpoints();
    }

    updateEndpoints() {
        let dir = new Vec2(Math.cos(this.angle), Math.sin(this.angle));
        let halfLen = dir.mult(this.width / 2);
        this.p1 = this.pos.sub(halfLen);
        this.p2 = this.pos.add(halfLen);

        // Normal vector (perpendicular to surface)
        this.normal = new Vec2(-Math.sin(this.angle), Math.cos(this.angle));
    }

    setPosition(x, y) {
        this.pos = new Vec2(x, y);
        this.updateEndpoints();
    }

    setAngle(angle) {
        this.angle = angle;
        this.updateEndpoints();
    }

    // Handles line segment intersection
    // Returns {hit: true/false, point: Vec2, normal: Vec2, distance: number}
    intersect(rayOrigin, rayDir) {
        // Ray-Line segment intersection logic
        let v1 = rayOrigin.sub(this.p1);
        let v2 = this.p2.sub(this.p1);
        let v3 = new Vec2(-rayDir.y, rayDir.x);

        let dot = v2.dot(v3);
        if (Math.abs(dot) < 0.0001) return null; // Parallel

        let t1 = v2.cross(v1) / dot;
        let t2 = rayDir.dot(new Vec2(v1.y, -v1.x)) / dot; // Equivalent to v1 x rayDir

        if (t1 >= 0.1 && t2 >= 0 && t2 <= 1) { // t1 >= 0.1 to avoid self-intersection
            let hitPoint = rayOrigin.add(rayDir.mult(t1));
            // Ensure normal faces the incoming ray
            let n = this.normal.copy();
            if (rayDir.dot(n) > 0) {
                n = n.mult(-1);
            }
            return {
                hit: true,
                point: hitPoint,
                normal: n,
                distance: t1
            };
        }
        return null;
    }

    // To be overridden by subclasses
    interact(rayDir, hitData, intensity) {
        return []; // Returns array of new rays {origin, dir, intensity}
    }

    draw(ctx) {
        // Base draw, overridden by subclass
    }
}

// 1. Mirror: Reflects 100% of light
class Mirror extends OpticalComponent {
    constructor(x, y, width, angle) {
        super(x, y, width, angle);
    }

    // Reflection Law: r = d - 2(d \cdot n)n
    interact(rayDir, hitData, intensity) {
        let n = hitData.normal;
        let dot = rayDir.dot(n);
        let reflectDir = rayDir.sub(n.mult(2 * dot)).normalize();

        return [{
            origin: hitData.point,
            dir: reflectDir,
            intensity: intensity
        }];
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.moveTo(this.p1.x, this.p1.y);
        ctx.lineTo(this.p2.x, this.p2.y);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 6;
        ctx.stroke();

        // Draw non-reflective back side
        let backDir = this.normal.mult(-3);
        ctx.beginPath();
        ctx.moveTo(this.p1.x + backDir.x, this.p1.y + backDir.y);
        ctx.lineTo(this.p2.x + backDir.x, this.p2.y + backDir.y);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 4;
        ctx.stroke();
    }
}

// 2. Glass (Refraction Medium): Snell's Law
class Glass extends OpticalComponent {
    constructor(x, y, width, angle, index = 1.5) {
        super(x, y, width, angle);
        this.index = index; // Refractive index (Air is approx 1.0)
    }

    // Snell's Law: n1 * sin(theta1) = n2 * sin(theta2)
    // Using vector form of refraction
    interact(rayDir, hitData, intensity) {
        // Determine if entering or exiting
        let n1 = 1.0; // Air
        let n2 = this.index; // Medium
        let n = hitData.normal;

        let cosI = -rayDir.dot(n);

        // If ray is inside medium and hitting boundary to exit
        if (cosI < 0) {
            n1 = this.index;
            n2 = 1.0;
            n = n.mult(-1);
            cosI = -rayDir.dot(n);
        }

        let eta = n1 / n2;
        let sinT2 = eta * eta * (1.0 - cosI * cosI);

        // Total Internal Reflection (TIR)
        if (sinT2 > 1.0) {
            // Reflect entirely
            let reflectDir = rayDir.add(n.mult(2 * cosI)).normalize();
            return [{ origin: hitData.point, dir: reflectDir, intensity: intensity }];
        }

        // Refraction
        let cosT = Math.sqrt(1.0 - sinT2);
        let refractDir = rayDir.mult(eta).add(n.mult(eta * cosI - cosT)).normalize();

        // Note: For a realistic block of glass, it has thickness.
        // For this 2D line-based abstraction, we just bend the ray once.
        // In a real simulation, we'd need a polygon to calculate entering and exiting.
        // For simplicity in this prototype, we treat it as an infinitely thin phase-shift boundary
        // or just apply the bend. To make it educational, we'll just bend it.
        return [{
            origin: hitData.point,
            dir: refractDir,
            intensity: intensity * 0.95 // Small absorption
        }];
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.moveTo(this.p1.x, this.p1.y);
        ctx.lineTo(this.p2.x, this.p2.y);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.lineWidth = 15;
        ctx.stroke();

        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

// 3. Beam Splitter: 50% Reflection, 50% Transmission
class BeamSplitter extends OpticalComponent {
    constructor(x, y, width, angle) {
        super(x, y, width, angle);
    }

    interact(rayDir, hitData, intensity) {
        let n = hitData.normal;
        let dot = rayDir.dot(n);

        // Reflected ray
        let reflectDir = rayDir.sub(n.mult(2 * dot)).normalize();

        // Transmitted ray (continues straight)
        let transmitDir = rayDir.copy();

        return [
            { origin: hitData.point, dir: reflectDir, intensity: intensity * 0.5 },
            { origin: hitData.point, dir: transmitDir, intensity: intensity * 0.5 }
        ];
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.moveTo(this.p1.x, this.p1.y);
        ctx.lineTo(this.p2.x, this.p2.y);

        // Dashed line for beam splitter
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.setLineDash([]);

        // Slightly transparent background
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 10;
        ctx.stroke();
    }
}

/**
 * -------------------------------------------------------------
 * Ray Tracing Engine
 * -------------------------------------------------------------
 */
function traceRays(sources, components, detectors, maxBounces = 10) {
    let beams = [];

    // Reset detectors
    detectors.forEach(d => d.detectedIntensity = 0);

    let raysToProcess = [];

    // Initialize rays from all active sources
    sources.forEach(source => {
        if (source.isOn) {
            raysToProcess.push({
                origin: source.pos,
                dir: source.dir,
                intensity: 1.0,
                bounces: 0
            });
        }
    });

    // Process rays iteratively (Breadth-First Ray Tracing)
    while (raysToProcess.length > 0) {
        let currentRay = raysToProcess.shift();

        if (currentRay.bounces > maxBounces || currentRay.intensity < 0.05) continue;

        let closestHit = null;
        let minDistance = Infinity;

        // 1. Check intersection with components
        for (let comp of components) {
            let hitData = comp.intersect(currentRay.origin, currentRay.dir);
            if (hitData && hitData.distance < minDistance) {
                minDistance = hitData.distance;
                closestHit = { type: 'component', comp: comp, data: hitData };
            }
        }

        // 2. Check intersection with detectors (circle intersection)
        for (let det of detectors) {
            // Ray-circle intersection
            let v = currentRay.origin.sub(det.pos);
            let b = 2 * v.dot(currentRay.dir);
            let c = v.dot(v) - det.radius * det.radius;
            let discriminant = b*b - 4*c;

            if (discriminant >= 0) {
                let t = (-b - Math.sqrt(discriminant)) / 2;
                if (t >= 0.1 && t < minDistance) {
                    minDistance = t;
                    closestHit = { type: 'detector', det: det, distance: t };
                }
            }
        }

        // 3. Resolve hit or go off screen
        let endPoint;
        if (closestHit) {
            if (closestHit.type === 'component') {
                endPoint = closestHit.data.point;
                beams.push(new BeamSegment(currentRay.origin, endPoint, currentRay.intensity));

                // Spawn new rays based on component interaction
                let newRays = closestHit.comp.interact(currentRay.dir, closestHit.data, currentRay.intensity);
                newRays.forEach(nr => {
                    raysToProcess.push({
                        origin: nr.origin,
                        dir: nr.dir,
                        intensity: nr.intensity,
                        bounces: currentRay.bounces + 1
                    });
                });
            } else if (closestHit.type === 'detector') {
                endPoint = currentRay.origin.add(currentRay.dir.mult(closestHit.distance));
                beams.push(new BeamSegment(currentRay.origin, endPoint, currentRay.intensity));

                // Add intensity to detector
                closestHit.det.detectedIntensity += currentRay.intensity;
            }
        } else {
            // No hit, extend ray off-screen
            endPoint = currentRay.origin.add(currentRay.dir.mult(2000));
            beams.push(new BeamSegment(currentRay.origin, endPoint, currentRay.intensity));
        }
    }

    return beams;
}

/**
 * -------------------------------------------------------------
 * Game State and Input Handling
 * -------------------------------------------------------------
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cw = window.innerWidth;
let ch = window.innerHeight;
canvas.width = cw;
canvas.height = ch;

window.addEventListener('resize', () => {
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
});

// Game State variables
let state = 'playing'; // 'playing', 'end'
let currentStage = 1;

let lasers = [];
let components = [];
let detectors = [];
let activeBeams = [];

// Drag & Drop State
let draggedComponent = null;
let dragOffset = new Vec2(0, 0);
let isRotating = false;

function updateOpticsPanel(title, formula, desc) {
    document.querySelector('#optics-panel h3').innerText = title;
    document.getElementById('optics-formula').innerText = formula;
    document.getElementById('optics-desc').innerText = desc;
}

// Input handling
function getPointerPos(e) {
    if (e.touches && e.touches.length > 0) {
        return new Vec2(e.touches[0].clientX, e.touches[0].clientY);
    }
    return new Vec2(e.clientX, e.clientY);
}

function handleStart(e) {
    if (state !== 'playing' || e.target !== canvas) return;
    let pos = getPointerPos(e);

    // Check if dragging a component
    for (let comp of components) {
        if (!comp.isDraggable) continue;

        // Simple distance check to center
        if (pos.dist(comp.pos) < 30) {
            draggedComponent = comp;
            dragOffset = comp.pos.sub(pos);
            // Right click/two fingers could trigger rotation, for simple UX we rotate on click near edge
            return;
        }

        // Check if clicking near edge for rotation
        if (pos.dist(comp.p1) < 20 || pos.dist(comp.p2) < 20) {
            draggedComponent = comp;
            isRotating = true;
            return;
        }
    }
}

function handleMove(e) {
    if (state !== 'playing' || !draggedComponent) return;
    let pos = getPointerPos(e);

    if (isRotating) {
        // Rotate component to face pointer
        let diff = pos.sub(draggedComponent.pos);
        let angle = Math.atan2(diff.y, diff.x);
        draggedComponent.setAngle(angle);
    } else {
        // Move component
        let newPos = pos.add(dragOffset);
        draggedComponent.setPosition(newPos.x, newPos.y);
    }
}

function handleEnd(e) {
    draggedComponent = null;
    isRotating = false;
}

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', handleStart, {passive: false});
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    handleMove(e);
}, {passive: false});
window.addEventListener('touchend', handleEnd);

/**
 * -------------------------------------------------------------
 * Stages and Game Logic
 * -------------------------------------------------------------
 */
function loadStage(stageNum) {
    lasers = [];
    components = [];
    detectors = [];
    state = 'playing';
    currentStage = stageNum;
    document.getElementById('message-banner').style.display = 'none';

    let cx = cw / 2;
    let cy = ch / 2;

    if (stageNum === 1) {
        document.getElementById('stage-title').innerText = "Stage 1: 거울 반사 (Reflection)";
        document.getElementById('stage-desc').innerText = "거울의 중심이나 끝을 드래그하여 각도를 맞춰 레이저를 목표에 도달시키세요.";
        updateOpticsPanel("반사의 법칙", "θi = θr", "매질의 경계면에서 반사될 때, 입사각과 반사각은 법선을 기준으로 항상 같습니다.");

        lasers.push(new LaserSource(cx - 300, cy, 0)); // Pointing right
        detectors.push(new Detector(cx, cy - 200));

        // Add one draggable mirror
        let mirror = new Mirror(cx, cy, 100, Math.PI / 4);
        components.push(mirror);

    } else if (stageNum === 2) {
        document.getElementById('stage-title').innerText = "Stage 2: 굴절 (Snell's Law)";
        document.getElementById('stage-desc').innerText = "유리 매질을 통과할 때 빛이 꺾이는 각도를 이용해 목표에 도달시키세요.";
        updateOpticsPanel("스넬의 법칙", "n1·sin(θ1) = n2·sin(θ2)", "빛이 서로 다른 매질을 통과할 때 굴절률(n)의 차이에 의해 진행 방향이 꺾입니다.");

        lasers.push(new LaserSource(cx - 300, cy - 100, 0)); // Pointing right
        detectors.push(new Detector(cx + 300, cy + 100)); // Offset due to refraction

        // Add a block of glass (high refractive index)
        let glass = new Glass(cx, cy, 300, Math.PI / 2, 1.8);
        components.push(glass);

    } else if (stageNum === 3) {
        document.getElementById('stage-title').innerText = "Stage 3: 광 분배기 (Beam Splitter)";
        document.getElementById('stage-desc').innerText = "빔 스플리터를 이용해 빛을 50:50으로 나누어 두 개의 목표를 동시에 켜세요.";
        updateOpticsPanel("파동 광학: 분배", "I_out = I_in / 2", "빔 스플리터는 빛의 절반을 투과시키고 절반을 반사시킵니다.");

        lasers.push(new LaserSource(cx - 300, cy, 0));
        detectors.push(new Detector(cx, cy - 200)); // Top
        detectors.push(new Detector(cx + 300, cy)); // Right

        let splitter = new BeamSplitter(cx, cy, 150, Math.PI / 4);
        components.push(splitter);

    } else if (stageNum === 4) {
        document.getElementById('stage-title').innerText = "Stage 4: Optical AND Gate";
        document.getElementById('stage-desc').innerText = "빔 스플리터를 역으로 활용해 두 빛이 겹치게 하여 임계치 이상이 되도록 하세요.";
        updateOpticsPanel("광학 논리 게이트", "AND Gate", "디텍터의 요구 강도가 높습니다. 두 개의 광원 신호가 합쳐져야만 활성화됩니다.");

        lasers.push(new LaserSource(cx - 300, cy, 0)); // Laser A
        lasers.push(new LaserSource(cx, cy + 300, -Math.PI/2)); // Laser B

        let det = new Detector(cx + 300, cy);
        det.requiredIntensity = 0.8; // Requires combination of two split beams
        detectors.push(det);

        let splitter = new BeamSplitter(cx, cy, 100, -Math.PI / 4);
        components.push(splitter);

        // Add a mirror to help redirect if needed
        components.push(new Mirror(cx - 100, cy - 200, 100, 0));
    }
}

function showClearMessage() {
    if (state === 'end') return;
    state = 'end';
    document.getElementById('message-banner').style.display = 'block';
    if (currentStage >= 4) {
        document.getElementById('message-text').innerText = "모든 스테이지 클리어! (포토닉스 마스터)";
        document.getElementById('next-stage-btn').innerText = "처음부터";
    } else {
        document.getElementById('message-text').innerText = "Signal Detected! (클리어)";
        document.getElementById('next-stage-btn').innerText = "다음 스테이지";
    }
}

document.getElementById('next-stage-btn').addEventListener('click', () => {
    if (currentStage >= 4) {
        loadStage(1);
    } else {
        loadStage(currentStage + 1);
    }
});

document.getElementById('reset-btn').addEventListener('click', () => {
    loadStage(currentStage);
});

/**
 * -------------------------------------------------------------
 * Game Loop (Update & Render)
 * -------------------------------------------------------------
 */

function gameLoop() {
    update();
    render(ctx);
    requestAnimationFrame(gameLoop);
}

function update() {
    if (state === 'end') return;

    // Run physics/ray tracing
    activeBeams = traceRays(lasers, components, detectors);

    // Check Win Condition (All detectors must be active)
    let allActive = true;
    for (let det of detectors) {
        if (det.detectedIntensity < det.requiredIntensity) {
            allActive = false;
            break;
        }
    }

    if (detectors.length > 0 && allActive) {
        showClearMessage();
    }
}

function render(ctx) {
    // Clear canvas (background handles table pattern via CSS, but we need to clear)
    ctx.clearRect(0, 0, cw, ch);

    // Draw Beams
    for (let beam of activeBeams) {
        beam.draw(ctx);
    }

    // Draw Components
    for (let comp of components) {
        comp.draw(ctx);
    }

    // Draw Detectors
    for (let det of detectors) {
        det.draw(ctx);
    }

    // Draw Lasers
    for (let laser of lasers) {
        laser.draw(ctx);
    }
}

// Start Game
loadStage(1);
requestAnimationFrame(gameLoop);

</script>
